[platformio]
default_envs = esp32dev_e1_profile

[env:esp32dev_e1_profile]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DQSHIFT_BOARD_PROFILE_CLASSIC_ESP32_DEVKIT_V1=1
lib_deps =
  adafruit/Adafruit NeoPixel@1.12.3
  bblanchon/ArduinoJson@7.2.1
